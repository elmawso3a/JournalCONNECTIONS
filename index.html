<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journal 2 Connections</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: hero with an animated hub (the project) and its five verbs, then three tools: map, recall, numbers. Language: AR, EN or both. */
:root{
  --bg:#F7F3EE; --surface:#FFFCF8; --ink:#25232A; --muted:#6A646B; --line:#E2D9D0;
  --accent:#9A512B; --accent-ink:#FFFFFF; --accent-soft:#F0DCCB;
  --ok:#2E7D4F; --bad:#B3392F;
  --g1:#2F6F6A; --g2:#7F6210; --g3:#3F5D8F; --g4:#A34A52; --g5:#6E4F8C;
  --display:'Baloo Bhaijaan 2','Cairo','Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  interpolate-size:allow-keywords;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1C21; --surface:#27262C; --ink:#F2ECE6; --muted:#A9A1A6; --line:#3A383F;
    --accent:#EDB892; --accent-ink:#1D1C21; --accent-soft:#3A2E27;
    --ok:#7BCB9A; --bad:#F0988F;
    --g1:#7FC4BC; --g2:#DDB95C; --g3:#8FB0E6; --g4:#E59AA0; --g5:#B99AD8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1C21; --surface:#27262C; --ink:#F2ECE6; --muted:#A9A1A6; --line:#3A383F;
  --accent:#EDB892; --accent-ink:#1D1C21; --accent-soft:#3A2E27;
  --ok:#7BCB9A; --bad:#F0988F;
  --g1:#7FC4BC; --g2:#DDB95C; --g3:#8FB0E6; --g4:#E59AA0; --g5:#B99AD8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:56rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* keyframes */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(8%,10%) scale(1.15)}}
@keyframes flip{from{opacity:0;transform:rotateX(-75deg)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes tick{to{stroke-dashoffset:0}}
@keyframes dotPop{0%{transform:scale(.3)}60%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.sp{position:absolute;inset-inline-start:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform-origin:left center;transform:scaleX(var(--sp,0))}
[dir="rtl"] .sp{transform-origin:right center}
.brandrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;padding-top:.7rem}
.brand{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.brand b{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.2}
.brand span{color:var(--muted);font-size:.85rem}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem 1rem}
.prog{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:block;width:5.5rem;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .7s var(--ease)}
.tabs{position:relative;display:flex;gap:.25rem;margin-top:.35rem}
.tabs a{padding:.55rem .95rem;text-decoration:none;color:var(--muted);font-weight:500;transition:color .25s}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs .ind{position:absolute;inset-inline-start:0;bottom:0;height:3px;border-radius:2px;background:var(--accent);width:0;transition:transform .45s var(--ease),width .45s var(--ease)}

main{padding-block:1.5rem 3rem;transition:opacity .16s,transform .16s}
main.swap{opacity:0;transform:translateY(6px)}
section[data-p]{display:block}
.panel-in>*{animation:rise .65s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.panel-in .nums>*,.panel-in .chips>*{animation:rise .6s var(--ease) both;animation-delay:calc(180ms + var(--i,0)*55ms)}

/* scroll reveal: resting state is visible, motion is added on top */
.rv{transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv:not(.in){opacity:.3;transform:translateY(18px)}

/* hero */
.hero{position:relative;isolation:isolate;overflow:clip;display:grid;gap:1rem 2rem;align-items:center;padding-block:.25rem .75rem}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;aspect-ratio:1;border-radius:50%;filter:blur(36px);opacity:.55;pointer-events:none}
.hero::before{width:55%;inset-inline-start:-8%;top:-18%;background:radial-gradient(circle,color-mix(in srgb,var(--g3) 34%,transparent),transparent 68%);animation:drift 15s ease-in-out infinite alternate}
.hero::after{width:48%;inset-inline-end:-6%;bottom:-20%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 36%,transparent),transparent 68%);animation:drift 19s ease-in-out infinite alternate-reverse}
@media(min-width:820px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,25rem)}}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6.5vw,3.3rem);line-height:1.2;text-wrap:balance;margin-top:.35rem}
h1 .en2{font-family:var(--display);font-weight:600;font-size:.42em;line-height:1.4;margin-top:.15rem}
.lead{margin-top:.8rem;max-width:42rem;font-size:1.05rem}
.en2{display:block;direction:ltr;text-align:left;color:var(--muted);font-size:.92em;line-height:1.6;margin-top:.2rem;font-weight:400}
.en1{margin-inline-start:.4em;font-size:.82em;font-weight:500;color:var(--muted)}
.btn .en1,.seg .en1,.know[aria-pressed="true"] .en1{color:inherit;opacity:.8}
.sub{margin-top:1.4rem;font-size:.82rem;color:var(--muted);font-weight:500}

/* hub */
.hub{width:100%;height:auto;display:block;max-width:26rem;margin-inline:auto;overflow:visible}
.hub .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);opacity:.8;animation:draw 1s cubic-bezier(.4,0,.2,1) .35s forwards}
.hub .core{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.hub .pulse{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}
.hub .ct{fill:var(--ink);font-family:var(--display);font-size:13px;text-anchor:middle}
.hub .ct.s{fill:var(--muted);font-family:var(--body);font-size:10.5px}
.hub .nd{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;animation:popIn .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.6s + var(--i)*.12s)}
.hub .nd circle{fill:color-mix(in srgb,var(--gk) 16%,var(--surface));stroke:var(--gk);stroke-width:2;transform-box:fill-box;transform-origin:center;transition:transform .3s var(--ease)}
.hub .nd:hover circle,.hub .nd:focus-visible circle{transform:scale(1.14)}
.hub .n{fill:var(--gk);font-family:var(--display);font-weight:800;font-size:18px;text-anchor:middle}
.hub .lb{fill:var(--ink);font-family:var(--display);font-size:15px;text-anchor:middle}
.hub .lb.e{fill:var(--muted);font-family:var(--body);font-size:11px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.6rem;margin-top:.5rem}
.tile{--g:var(--g1);text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;padding:.8rem .9rem;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--g) 11%,var(--surface));transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s}
.tile b{font-family:var(--display);font-size:1.2rem;line-height:1.3;color:var(--g)}
.tile b .en1{display:block;margin:0;font-family:var(--body);font-size:.68em;line-height:1.3}
.tile span{font-size:.85rem;font-weight:600}
.tile small{color:var(--muted);font-size:.78rem;line-height:1.5}
.tile:hover{transform:translateY(-4px);border-color:var(--g);box-shadow:0 10px 22px -12px color-mix(in srgb,var(--g) 55%,transparent)}
.tile:active{transform:translateY(-1px) scale(.98)}

/* template */
.tpl{margin-top:1.4rem;padding:1rem 1.1rem;border:1px dashed var(--line);border-radius:10px;display:grid;gap:.9rem}
.tpl ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.7rem}
.tpl li{font-size:.9rem;line-height:1.6}
.tpl li b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--accent)}
.tpl p{font-size:.9rem;color:var(--muted)}

/* groups + LO rows */
.grp{--g:var(--g1);margin-top:2.4rem;scroll-margin-top:7rem}
.grp header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem 1rem;padding-bottom:.5rem;border-bottom:2px solid var(--g)}
.grp h2{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.3;color:var(--g)}
.grp h2 .en1{font-family:var(--display);font-size:.55em;font-weight:600;color:var(--g);opacity:.8}
.grp header p{color:var(--muted);font-size:.95rem}
.grp header .en2{margin:0;font-size:.9em}
.lo{border-bottom:1px solid var(--line)}
.lo::details-content{block-size:0;overflow:clip;transition:block-size .4s var(--ease),content-visibility .4s allow-discrete}
.lo[open]::details-content{block-size:auto}
.lo summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.2rem .8rem;align-items:center;padding:.85rem .4rem;border-radius:8px;transition:background .25s}
.lo summary::-webkit-details-marker{display:none}
.lo summary:hover{background:color-mix(in srgb,var(--g) 7%,transparent)}
.tag{font-family:var(--mono);font-size:.74rem;white-space:nowrap;color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--surface));padding:.15rem .5rem;border-radius:5px}
.nm{min-width:0}
.nm b{display:block;font-weight:600;line-height:1.5;transition:color .25s}
.lo summary:hover .nm b{color:var(--g)}
.nm span.h{display:block;font-size:.85rem;color:var(--muted);line-height:1.5}
.nm .en2{font-size:.95em;margin:0}
.side{display:flex;align-items:center;gap:.6rem}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--g);display:block;transition:background .3s}
.dots i.on{background:var(--g)}
.dots i.pop{animation:dotPop .5s var(--ease)}
.chev{width:.55rem;height:.55rem;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .35s var(--ease)}
.lo[open] .chev{transform:rotate(-135deg)}
.lo .body{padding:.2rem .4rem 1.2rem}
.lo dl{margin:0;display:grid;gap:.75rem}
.lo dl div{display:grid;gap:.1rem .9rem}
.lo[open] dl div{animation:rise .5s var(--ease) both}
.lo[open] dl div:nth-child(1){animation-delay:.05s}
.lo[open] dl div:nth-child(2){animation-delay:.12s}
.lo[open] dl div:nth-child(3){animation-delay:.19s}
.lo[open] dl div:nth-child(4){animation-delay:.26s}
.lo dt{font-size:.78rem;font-weight:600;color:var(--muted)}
.lo dd{margin:0;min-width:0}
.lo dl div.link dt{color:var(--g)}
.lo dl div.link dd{font-weight:500}
@media(min-width:640px){.lo dl div{grid-template-columns:6.4rem minmax(0,1fr)}.lo dt{padding-top:.3rem}}
.know{margin-top:1rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.88rem;font-weight:500;transition:background .3s,color .3s,border-color .3s,transform .2s}
.know:active{transform:scale(.95)}
.know[aria-pressed="true"]{background:var(--g);color:var(--bg);border-color:var(--g);animation:pop .4s var(--ease)}

/* buttons */
.btn{cursor:pointer;padding:.6rem 1.1rem;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px -10px var(--accent)}
.btn:active{transform:scale(.96)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:.4rem .8rem;font-size:.88rem}

/* controls */
.ctrl{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{cursor:pointer;border:0;padding:.45rem .85rem;background:var(--surface);font-weight:500;font-size:.88rem;transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.chip{--g:var(--ink);cursor:pointer;padding:.25rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;transition:background .3s,border-color .3s,color .3s,transform .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{border-color:var(--g);color:var(--g);font-weight:600;background:color-mix(in srgb,var(--g) 12%,var(--surface))}
.chip .en1{color:inherit;opacity:.75}

/* recall */
#stage{perspective:1100px}
.fc{margin-top:1.2rem;padding:1.3rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;gap:.9rem;transform-origin:center top}
.fc.flip{animation:flip .55s var(--ease)}
.fc.slide{animation:slideIn .5s var(--ease)}
[dir="rtl"] .fc.slide{animation-name:slideInR}
@keyframes slideInR{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.fc h3{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.3;unicode-bidi:isolate}
.fc .tag{justify-self:start}
.cue{color:var(--muted);font-size:.92rem}
.ans{display:grid;gap:.7rem}
.ans div{display:grid;gap:.05rem;animation:rise .5s var(--ease) both}
.ans div:nth-child(2){animation-delay:.08s}
.ans div:nth-child(3){animation-delay:.16s}
.ans dt{font-size:.78rem;font-weight:600;color:var(--muted)}
.ans dd{margin:0}
.ans .link dd{font-weight:500}
.row-b{display:flex;flex-wrap:wrap;gap:.6rem}
.ex{margin:0;padding:.2rem 0;font-size:1.02rem}
.opts{display:grid;gap:.5rem}
.opt{cursor:pointer;text-align:start;padding:.65rem .9rem;border:1px solid var(--line);border-radius:9px;background:var(--bg);display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:baseline;animation:rise .5s var(--ease) both;transition:border-color .25s,background .25s,transform .2s}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.opt:not(:disabled):hover{transform:translateX(4px);border-color:var(--accent)}
[dir="rtl"] .opt:not(:disabled):hover{transform:translateX(-4px)}
.opt .tag{background:transparent;padding:0;color:var(--muted)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));animation:pop .5s var(--ease),glow .8s ease-out}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));animation:shake .45s}
.fb{font-weight:600;animation:rise .4s var(--ease) both}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.fbx{animation:rise .5s var(--ease) .1s both}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:.9rem;margin-top:1.2rem}
.num{padding:1.1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:.6rem;align-content:start;min-width:0;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.num:hover{box-shadow:0 12px 24px -16px var(--accent)}
.num.swapin{animation:rise .5s var(--ease) both}
.num.shake{animation:shake .45s}
.num.good{animation:glow .9s ease-out}
.num .tag{justify-self:start;color:var(--accent);background:var(--accent-soft)}
.num h3{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.4}
.num h3 .en1{font-family:var(--body);font-size:.7em}
.num code{display:block;direction:ltr;text-align:start;font-family:var(--mono);font-size:.82rem;color:var(--muted);overflow-x:auto}
.inrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.inrow input{width:7.5rem;min-width:0;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);direction:ltr;text-align:start;font-variant-numeric:tabular-nums;transition:border-color .25s,box-shadow .25s}
.inrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.unit{font-family:var(--mono);font-size:.85rem;color:var(--muted);direction:ltr}
.res{min-height:1.4rem;font-size:.92rem}
.res.ok{color:var(--ok);font-weight:600}.res.no{color:var(--bad);font-weight:600}
.res>span{animation:rise .4s var(--ease) both;display:inline-block}
.ck{width:1.1em;height:1.1em;vertical-align:-.15em;margin-inline-end:.3em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:tick .5s .1s forwards}
.sol{font-family:var(--mono);direction:ltr;text-align:start;font-size:.85rem;padding:.5rem .7rem;border-radius:8px;background:var(--accent-soft);animation:rise .4s var(--ease) both}
.sol .en2,.sol .nt{font-family:var(--body)}
.foot{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
<header class="top"><div class="wrap">
  <div class="brandrow">
    <div class="brand"><b>Journal 2</b><span data-k="brandSub" data-m="i"></span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language / اللغة" id="langSeg">
        <button type="button" data-l="ar" aria-pressed="false">عربي</button>
        <button type="button" data-l="en" aria-pressed="false">EN</button>
        <button type="button" data-l="both" aria-pressed="true">AR+EN</button>
      </div>
      <div class="prog"><span id="progTxt"></span><span class="bar"><i id="progBar"></i></span></div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#map" data-t="map" data-k="tabMap" data-m="i"></a>
    <a href="#drill" data-t="drill" data-k="tabDrill" data-m="i"></a>
    <a href="#numbers" data-t="numbers" data-k="tabNumbers" data-m="i"></a>
    <span class="ind" id="ind"></span>
  </nav>
  <span class="sp" id="sp"></span>
</div></header>

<main class="wrap">
  <section id="p-map" data-p="map">

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
var app=$('#app'),main=$('main');
var RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---- language ---- */
var lang='both';
try{var sl=localStorage.getItem('kfs-j2-lang');if(sl==='ar'||sl==='en'||sl==='both')lang=sl}catch(e){}
function L(p){

  if(lang==='en')return esc(p[1]);
  return esc(p[0])+'<span class="en2" dir="ltr" lang="en">'+esc(p[1])+'</span>';
}
function I(p){
  if(lang==='ar')return esc(p[0]);
  if(lang==='en')return esc(p[1]);
  return esc(p[0])+'<span class="en1" dir="ltr" lang="en">'+esc(p[1])+'</span>';
}
function S(p){return lang==='en'?p[1]:p[0]}

var U={
 brandSub:['الكونيكشنز · KFS G10','Connections · KFS G10'],
 tabMap:['الخريطة','Map'],tabDrill:['اختبرني','Quiz me'],tabNumbers:['الأرقام','Numbers'],
 h1Map:['كل المواد بتحكي نفس الحكاية','Every subject tells the same story'],
 leadMap:['مشروعنا حاجز passive بيعزل: بيتحكم في عبور الحرارة أو الضوء أو الميّة، من خامات معاد استخدامها، وكتلته لا تزيد عن 5 kg. الـ 26 LO كلها بتخدم الحكاية دي بفعل واحد من خمسة. احفظ الخمسة أفعال، والباقي هتفهمه لوحده.',
  'Our project is a passive insulating barrier. It controls how heat, light or water passes through it, it is built from reused materials, and it must not exceed 5 kg. All 26 LOs serve that story through one of five verbs. Learn the five verbs and the rest explains itself.'],
 subMap:['الخمس أفعال، دوس على أي واحد','The five verbs. Tap any one'],
 tplCt:['المفهوم','Concept'],tplCd:['القاعدة نفسها، بمصطلحاتها الإنجليزي.','The rule itself, with its key terms.'],
 tplLt:['الربط','Link'],tplLd:['ليه المفهوم ده يخص المشروع.','Why it matters to the project.'],
 tplEt:['المثال','Example'],tplEd:['حاجة تطبقها على الحاوية، غالبًا برقم.','Something you apply to the container, often with a number.'],
 tplXt:['بس','But'],tplXd:['حدود الربط، وده اللي بيفرق في الإجابة.','The limits of the link, which is what separates a good answer.'],
 tplNote:['الجورنال نفسه كاتب إنه مش للبصمجة. لو نسيت تفصيلة، اسأل نفسك الأربع أسئلة دي وهتطلع الإجابة.','The journal itself says it is not for memorizing. If you forget a detail, ask yourself these four questions and the answer comes back.'],
 h1Drill:['اختبرني','Quiz me'],
 leadDrill:['الكارت اللي بتنساه بيرجع لك أكتر. اللي بتعرفه بيبعد، لحد ما يثبت.','Cards you forget come back more often. Cards you know move away until they stick.'],
 mFlash:['فلاش كارد','Flashcards'],mGuess:['مثال ← LO','Example → LO'],
 h1Num:['الأرقام','Numbers'],
 leadNum:['كل الحسابات اللي في الجورنال، بأرقام بتتغير كل مرة. لو بتفهم القانون مش هتفرق معاك الأرقام.','Every calculation in the journal, with numbers that change each time. If you understand the formula, the numbers will not matter.'],
 foot:['مبني على Journal 2 من KFS Capstone Club (المؤسسة: Salma Fathy). الأمثلة والأرقام من الجورنال.','Built from Journal 2 by KFS Capstone Club (founder: Salma Fathy). Examples and numbers come from the journal.'],
 hubAlt:['خريطة الحاجز الـ passive والخمس أفعال','The passive barrier and its five verbs'],
 concept:['المفهوم','Concept'],link:['الربط','Link'],example:['المثال','Example'],but:['بس','But'],sum:['الخلاصة','In short'],
 known:['علّم إني عارفها','Mark as known'],knownOn:['عارفها','Known'],
 all:['الكل','All'],reveal:['اكشف الإجابة','Reveal answer'],gotIt:['عرفتها','Got it'],forgot:['نسيت','Forgot'],
 cueFlash:['قول الكونيكشن بصوتك قبل ما تكشف: الربط، المثال، بس.','Say the connection out loud before you reveal: link, example, but.'],
 cueGuess:['المثال ده بتاع أنهي LO؟','Which LO is this example from?'],
 right:['صح','Correct'],wrong:['لأ، الصح هو','Not quite, the answer is'],next:['التالي','Next'],
 check:['اتأكد','Check'],newn:['أرقام تانية','New numbers'],sol:['الحل','Solution'],
 enter:['اكتب رقم.','Enter a number.'],miss:['مش دقيق. راجع القانون وجرّب تاني، أو دوس الحل.','Not quite. Review the formula and try again, or open the solution.'],
 yours:['إجابتك','Your answer']
};

var GROUPS=[
 {v:['يحمي ويعزل','Protect & block'],q:['إيه اللي بنحميه، وإيه اللي بنمنعه يعدّي؟','What are we protecting, and what are we stopping from passing through?'],css:'--g1'},
 {v:['يختار الخامة','Choose the material'],q:['هنبني من إيه، وليه؟','What do we build from, and why?'],css:'--g2'},
 {v:['يشكّل ويثبّت','Shape & stabilize'],q:['شكله إيه، وهيقف ثابت إزاي؟','What shape is it, and how does it stay stable?'],css:'--g3'},
 {v:['يقيس ويختبر','Measure & test'],q:['إزاي نثبت إن التصميم شغال؟','How do we prove the design works?'],css:'--g4'},
 {v:['يوثّق ويعرض','Document & present'],q:['إزاي نوصّل شغلنا؟','How do we communicate our work?'],css:'--g5'}
];

/* each field is [arabic, english] */
var LOS=[
{id:'bio1',s:'Biology',lo:1,t:'Cell theory & diseases',g:0,
 h:['الحرارة تبوّظ الخلايا والأكل','Heat damages cells and food'],
 c:[`Cell theory: كل كائن حي مكوّن من خلايا، والخلية هي الوحدة الأساسية للحياة. الأمراض يا infectious (بكتيريا أو فيروسات، وبعضها بينتقل بـ vectors زي البعوض) يا non-infectious (جينات أو بيئة).`,
    `Cell theory: all living things are made of cells, the basic unit of life. Diseases are either infectious (bacteria or viruses, sometimes spread by vectors such as mosquitoes) or non-infectious (genetics or environment).`],
 l:[`البيولوجي والهندسة الاتنين بيدرسوا تأثير الظروف البيئية على الحاجات الحية. الحرارة العالية بتأثر على الخلايا وبتبوّظ الأكل، والتغليف المناسب بيحميه من الحرارة والرطوبة.`,
    `Biology and engineering both study how environmental conditions affect living things. High temperature harms cells and spoils food, and suitable packaging protects food from heat and moisture.`],
 e:[`البروتوتايب بيقلل heat transfer بخامات عازلة زي كرتون معاد استخدامه أو قماش.`,
    `The prototype reduces heat transfer with insulating materials such as reused cardboard or fabric.`],
 x:[`العزل مش بيقتل الميكروبات ولا بيمنع كل الأمراض. لازم نختبر تأثيره على الحرارة أو انتقال الميّة.`,
    `Insulation does not kill microorganisms or prevent every disease. We must test its effect on temperature or water transfer.`]},
{id:'bio2',s:'Biology',lo:2,t:'Prokaryotic vs eukaryotic cells',g:0,
 h:['الخلية محتاجة ظروف مناسبة','Cells need suitable conditions'],
 c:[`Prokaryotic (زي bacteria): من غير nucleus. Eukaryotic (نبات وحيوان): فيها nucleus و organelles محاطة بغشاء. الاتنين عندهم cell membrane بتتحكم في اللي بيدخل ويطلع.`,
    `Prokaryotic cells (e.g. bacteria) have no nucleus. Eukaryotic cells (plants, animals) have a nucleus and membrane-bound organelles. Both have a cell membrane that controls what enters and leaves.`],
 l:[`الخلايا الحية محتاجة ظروف بيئية مناسبة عشان تشتغل، والبروتوتايب مصمم يتحكم في انتقال الطاقة أو المادة عبر حاجز.`,
    `Living cells need suitable environmental conditions to function, and the prototype is designed to control the transfer of energy or matter through a barrier.`],
 e:[`حاوية عازلة حراريًا ممكن تفضّل عينة بيولوجية حساسة في مدى حرارة مناسب وقت أطول. نقارن الحرارة جوّه حاوية معزولة بحرارة جوّه حاوية غير معزولة.`,
    `A thermal insulation container can keep a temperature-sensitive biological sample in a suitable range for longer. We compare the temperature inside an insulated container with an uninsulated one.`],
 x:[`العزل الـ passive مش بيتحكم في الحرارة بدقة زي الـ laboratory incubator.`,
    `A passive insulation prototype does not control temperature as precisely as a laboratory incubator.`]},
{id:'bio3',s:'Biology',lo:3,t:'Membrane, diffusion & osmosis',g:0,
 h:['الـ membrane حاجز زي البروتوتايب','A membrane is a barrier, like the prototype'],
 c:[`Cell membrane = selectively permeable: بتعدّي حاجات وتمنع حاجات. Diffusion: الجزيئات بتتحرك من تركيز عالي لتركيز واطي. Osmosis: حركة الميّة عبر membrane selectively permeable.`,
    `The cell membrane is selectively permeable. Diffusion: particles move from higher to lower concentration. Osmosis: movement of water through a selectively permeable membrane.`],
 l:[`البروتوتايب كمان حاجز بيتحكم في انتقال المادة أو الطاقة.`,
    `The prototype also acts as a barrier that controls the transfer of matter or energy.`],
 e:[`لو اخترنا water insulation نقارن بلاستيك وقماش وكرتون: مين بيعدّي ميّة أقل. نقيس كتلة الميّة قبل وبعد الاختبار. Water loss % = lost ÷ initial × 100. فقد 10 g من 100 g يعني 10%.`,
    `For water insulation, compare plastic sheet, fabric and cardboard to see which lets less water through. Measure the water mass before and after: Water loss % = lost ÷ initial × 100, so losing 10 g of 100 g is 10%.`],
 x:[`نسبة فقد أقل تعني حماية أحسن، بشرط إن كل العينات اتختبرت بنفس الظروف. وخامات العزل العادية مش شغالة زي الـ membranes أو الـ protein channels. وانتقال الحرارة مش نفس الـ diffusion.`,
    `A lower percentage means better water protection only if all samples are tested under the same conditions. Ordinary insulation does not work like membranes or protein channels, and heat transfer is not diffusion.`]},
{id:'bio4',s:'Biology',lo:4,t:'DNA & RNA',g:0,
 h:['العينة الوراثية حساسة للظروف','Genetic material is sensitive to conditions'],
 c:[`Genetics: تخزين المعلومة الوراثية ونقلها. DNA و RNA = nucleic acids من nucleotides. DNA خيطين مكمّلين (double helix) و4 قواعد: A, T, C, G، والأزواج A–T و C–G. RNA غالبًا خيط واحد ومكان T فيه U (uracil). الاتنين عندهم sugar-phosphate backbone.`,
    `Genetics: how genetic information is stored and passed on. DNA and RNA are nucleic acids made of nucleotides. DNA has two complementary strands (double helix) and four bases A, T, C, G, pairing A–T and C–G. RNA is usually one strand, with uracil (U) replacing T. Both have a sugar-phosphate backbone.`],
 l:[`المواد البيولوجية محتاجة ظروف مستقرة. الحرارة العالية وبعض العوامل البيئية ممكن تبوّظ العينات وتأثر على المادة الوراثية.`,
    `Biological materials need suitable conditions to stay stable. High temperatures and other environmental factors can damage samples and their genetic material.`],
 e:[`البروتوتايب ممكن يخلّي الظروف جوّه الحاوية أثبت لأنه يقلل heat transfer. نقارن حرارة حاوية معزولة بحاوية غير معزولة عشان نقيّم الأداء.`,
    `The prototype could keep conditions inside a container more stable by reducing heat transfer. Compare an insulated container with an uninsulated one to evaluate performance.`],
 x:[`العزل مش بيحمي DNA مباشرة ولا بيصلّحه. بس فهم تخزين المعلومة بيوضّح ليه التحكم في الظروف مهم.`,
    `Insulation does not directly protect or repair DNA. Understanding how biological materials store information shows why controlling conditions matters.`]},

{id:'geo1',s:'Geology',lo:1,t:'Earth materials & engineering',g:1,
 h:['الخامة المناسبة تعني نجاح البروتوتايب','The right material means a successful prototype'],
 c:[`Geology بتدرس الـ Earth materials والعمليات اللي بتشكّل الكوكب. بتربط chemistry (تركيب المعادن) و physics (الحرارة والطاقة) و engineering (اختيار مواد البناء).`,
    `Geology studies Earth materials and the processes that shape our planet. It connects to chemistry (mineral composition), physics (heat and energy) and engineering (choosing construction materials).`],
 l:[`نجاح البروتوتايب بيعتمد على اختيار خامات مناسبة وفهم سلوكها.`,
    `The prototype's success depends on choosing suitable materials and understanding how they behave.`],
 e:[`نعيد استخدام كرتون أو قماش أو فلين (cork) أو تغليف بلاستيك لبناء حاوية عزل حراري، وندرس خواصها ونختبر قد إيه بتقلل heat transfer. الحجر والطين أمثلة على مواد طبيعية في البناء.`,
    `Reuse cardboard, fabric, cork or plastic packaging to build a thermal insulation container, study their properties and test how well they reduce heat transfer. Stone and clay are natural construction materials.`],
 x:[`الخامة الطبيعية مش دايمًا أحسن من المصنّعة. بنقارن بالأداء والكتلة والتكلفة والأمان والأثر البيئي. وإعادة استخدام خامة مناسبة بتقلل الـ waste.`,
    `A natural material is not always better than a manufactured one. Compare performance, mass, cost, safety and environmental impact. Reusing suitable materials reduces waste.`]},
{id:'geo2',s:'Geology',lo:2,t:'Minerals',g:1,
 h:['الفلين وفراغات الهوا','Cork and trapped air'],
 c:[`Minerals: مواد أرضية صلبة طبيعية بتركيب وبنية محددين. بنتعرف عليها بـ hardness و color و streak و cleavage و fracture و magnetism.`,
    `Minerals are naturally occurring solid Earth materials with specific composition and structure. They are identified by hardness, color, streak, cleavage, fracture and magnetism.`],
 l:[`المهندس لازم يحدد الخامات ويقارنها قبل ما يختار واحدة للتصميم.`,
    `Engineers must also identify and compare materials before choosing one for a design.`],
 e:[`الفلين (cork) ممكن يكون عازل لأن بنيته فيها فراغات هوا صغيرة كتير. الحجر قوي ومتين، بس سلوكه الحراري ممكن يخليه أقل مناسبة لبعض تصميمات العزل. نقارن cork بكرتون أو قماش معاد بقياس تغيّر الحرارة في حاويات متطابقة.`,
    `Cork may insulate well because its structure holds many small air spaces. Stone is strong and durable, but its thermal behavior may make it less suitable. Compare cork with reused cardboard or fabric by measuring temperature change in identical containers.`],
 x:[`تحديد المعادن نفسه مش مطلوب في التحدي، المهم فهم خواص الخامة. ولو هنستخدم cork لازم يكون متاح كخامة نضيفة معاد استخدامها.`,
    `Mineral identification itself is not required by the challenge, but understanding material properties is. If cork is used, it should be available as a clean reused material.`]},
{id:'geo3',s:'Geology',lo:3,t:'Engineering properties',g:1,
 h:['الأقوى مش دايمًا الأنسب','Strongest is not always best'],
 c:[`الخامات الطبيعية والمصنّعة ليها engineering properties: strength و hardness و flexibility و density وسلوكها تحت الضغط (behavior under stress). الخواص دي بتحدد الخامة تنفع لهيكل معيّن ولا لأ.`,
    `Earth and manufactured materials differ in engineering properties: strength, hardness, flexibility, density and behavior under stress. These decide whether a material suits a specific structure.`],
 l:[`لازم نختار خامات تقلل انتقال heat أو sound أو light أو water، وفي نفس الوقت يفضل البروتوتايب ضمن حدود الحجم والكتلة.`,
    `We must choose materials that reduce the transfer of heat, sound, light or water while keeping the prototype within the size and mass limits.`],
 e:[`لوح الكرتون خفيف وسهل إعادة استخدامه بس بينحني تحت حِمل تقيل. البلاستيك ممكن يقاوم الميّة بس مش بيعزل حراريًا زي خامة متعددة الطبقات. والكرتون المطوي أو الحاجز المتعدد الطبقات أصلب (stiffness) من لوح مسطح.`,
    `A cardboard panel is light and easy to reuse but bends under a heavy load. A plastic sheet may resist water but not insulate as well as a suitable layered material. Folded cardboard or a layered barrier is stiffer than a flat sheet.`],
 x:[`أحسن خامة مش الأقوى. هي اللي تعمل الوظيفة المطلوبة بأمان وكفاءة وبأقل كمية عملية من الخامة.`,
    `The best material is not the strongest one. It is the one that performs the required function safely and efficiently using the least practical amount of material.`]},
{id:'geo4',s:'Geology',lo:4,t:'Igneous rocks',g:1,
 h:['Pumice والمسام والـ density','Pumice, pores and density'],
 c:[`Igneous rocks: بتتكوّن لما magma أو lava تبرد وتتصلب. Intrusive: بتبرد ببطء تحت الأرض فتطلع بلورات كبيرة. Extrusive: بتبرد بسرعة عند السطح فتطلع بلورات أصغر. سرعة التبريد بتحدد الـ texture.`,
    `Igneous rocks form when magma or lava cools and solidifies. Intrusive: cools slowly underground, large crystals. Extrusive: cools quickly at or near the surface, smaller crystals. The cooling rate sets the texture.`],
 l:[`تكوّن الخامة وبنيتها بيأثروا على خواصها الهندسية.`,
    `A material's formation and structure affect its engineering properties.`],
 e:[`Pumice صخر بركاني فيه ثقوب صغيرة كتير، فهو خفيف وممكن يكون عازل طبيعي. Density = mass ÷ volume. كتلة 60 g وحجم 100 cm³ يعني density = 0.6 g/cm³.`,
    `Pumice has many small holes, so it is lightweight and can insulate naturally. Density = mass ÷ volume: 60 g in 100 cm³ gives 0.6 g/cm³.`],
 x:[`لازم نختبر الأداء الفعلي. مش كل خامة مسامية عازل كويس.`,
    `Test the actual performance. Not every porous material is a good insulator.`]},

{id:'math1',s:'Math',lo:1,t:'Trigonometry',g:2,
 h:['زاوية اللوح وارتفاعه','Panel angle and height'],
 c:[`Trigonometry: زوايا ومسافات وأشكال. الـ unit circle بيربط الزاوية بالـ sine و cosine، و sine/cosine laws بتحسب أضلاع وزوايا مجهولة. في المثلث القائم: sin θ = opposite ÷ hypotenuse.`,
    `Trigonometry covers angles, distances and shapes. The unit circle links angles to sine and cosine, and the sine and cosine laws find unknown sides and angles. In a right triangle: sin θ = opposite ÷ hypotenuse.`],
 l:[`بنصمم ألواح مائلة ودعامات مثلثة ودروع بزاوية لشكل البروتوتايب.`,
    `We use it to design sloped panels, triangular supports and angled shields for the prototype.`],
 e:[`درع ضوء لوحه طوله 20 cm ومائل 30°: h = 20 sin 30° = 20 × 0.5 = 10 cm. وزوايا الارتفاع والانخفاض (elevation / depression) بتوضح اتجاه الضوء الداخل.`,
    `A light shield panel 20 cm long tilted at 30°: h = 20 sin 30° = 20 × 0.5 = 10 cm. Angles of elevation and depression show the direction of incoming light.`],
 x:[`اختار أبسط زاوية مناسبة. والشكل النهائي لازم يفضل ضمن حدود الحجم والكتلة، وأداؤه يتختبر تجريبيًا.`,
    `Choose the simplest suitable angle. The final shape must fit the volume and mass limits and be tested experimentally.`]},
{id:'math2',s:'Math',lo:2,t:'Statistics',g:3,
 h:['Mean و range لمقارنة العزل','Mean and range to compare insulation'],
 c:[`نسجل القياسات في جداول ونعرضها بـ histograms أو dot plots أو stem plots أو boxplots أو scatter plots. Mean و range و IQR و standard deviation بتوصف النتايج وتشتتها.`,
    `Record measurements in tables and show them as histograms, dot plots, stem plots, boxplots or scatter plots. Mean, range, IQR and standard deviation describe the results and their spread.`],
 l:[`بنقارن خامات العزل ونقرر أي تصميم أداؤه أحسن بالأرقام.`,
    `We compare insulation materials and decide which design performs best, using numbers.`],
 e:[`3 اختبارات لخامة نزّلت الحرارة 4 و5 و6 °C: mean = (4+5+6) ÷ 3 = 5 °C و range = 6 − 4 = 2 °C. وفي scatter plot الوقت هو independent variable والحرارة هي المتغير المقاس، و regression line بتقدّر الاتجاه.`,
    `Three tests drop the temperature by 4, 5 and 6 °C: mean = (4+5+6) ÷ 3 = 5 °C and range = 6 − 4 = 2 °C. In a scatter plot, time is the independent variable and temperature the measured one; a regression line estimates the trend.`],
 x:[`range أصغر ممكن يدل على نتايج أثبت، بس 3 قياسات مش كفاية لإثبات الـ reliability. و correlation مش بتثبت causation.`,
    `A smaller range can suggest more consistent results, but three measurements may not establish reliability. Correlation does not prove causation.`]},
{id:'math3',s:'Math',lo:3,t:'Geometry',g:2,
 h:['الحجم 3000 cm³','Volume of 3000 cm³'],
 c:[`2D: طول وعرض. 3D: طول وعرض وارتفاع. Cross section: شكل 2D بيظهر لما مستوى يقطع جسم 3D. Regular polyhedra: مجسمات أوجهها مضلعات مسطحة وأحرفها وزواياها متساوية.`,
    `2D shapes have length and width; 3D objects add height. A cross section is the 2D shape made when a plane cuts a 3D object. Regular polyhedra have flat polygonal faces with equal edges and angles.`],
 l:[`محتاجين نختار شكل مناسب للبروتوتايب، ففهم العلاقة بين 2D و 3D مهم.`,
    `We need a suitable shape for the prototype, so the relation between 2D and 3D shapes matters.`],
 e:[`صندوق مستطيل مبني من مستطيلات 2D. الأبعاد 20 × 15 × 10 cm، فـ Volume = L × W × H = 3000 cm³. نقارن مجسمات 3D مختلفة عشان نختار التصميم اللي بيستخدم الخامة بكفاءة ويدّي مساحة داخلية كفاية.`,
    `A rectangular box built from 2D rectangles, 20 × 15 × 10 cm: Volume = L × W × H = 3000 cm³. Compare different 3D shapes to pick the design that uses material efficiently and gives enough internal space.`]},
{id:'mech1',s:'Mechanics',lo:1,t:'Motion graphs',g:3,
 h:['Graph الحرارة مع الوقت','A temperature-time graph'],
 c:[`Mechanics: position و velocity و acceleration. ميل (slope) الـ position-time graph = velocity، وميل الـ velocity-time graph = acceleration. Average velocity = displacement ÷ time، و instantaneous velocity هي السرعة في لحظة معيّنة.`,
    `Mechanics describes motion with position, velocity and acceleration. The slope of a position-time graph is velocity; the slope of a velocity-time graph is acceleration. Average velocity = displacement ÷ time; instantaneous velocity is the velocity at one moment.`],
 l:[`الربط غير مباشر: بنستخدم الرسوم البيانية عشان نسجل التغيّر أثناء الاختبار.`,
    `The link is indirect: graphs help us record changes during our tests.`],
 e:[`نرسم temperature مقابل time عشان نقارن بتبرد قد إيه حاويات مختلفة. ده temperature-time graph مش position-time، بس نفس فكرة دراسة متغير بيتغير مع الوقت.`,
    `Plot temperature against time to compare how quickly different containers cool. It is a temperature-time graph, not position-time, but the same idea of one variable changing with time applies.`],
 x:[`البروتوتايب نفسه مفروض ميحتاجش حركة بمحرك. أهم استخدام هو جمع بيانات مع الوقت ومقارنة أداء التصميمات.`,
    `The prototype itself should not need powered movement. The most useful application is collecting time-based data and comparing designs.`]},
{id:'mech2',s:'Mechanics',lo:2,t:'Kinematics & free fall',g:2,
 h:['ثبات التجربة مش حركتها','A stable test, not moving parts'],
 c:[`المساحة تحت الـ velocity-time graph = displacement. مع acceleration ثابتة: v = u + at (u السرعة الابتدائية). Free fall: الجاذبية هي القوة الأساسية المؤثرة.`,
    `The area under a velocity-time graph is displacement. With constant acceleration use v = u + at (u is the initial velocity). Free fall is motion where gravity is the main force.`],
 l:[`مش محوري للتحدي لأن البروتوتايب شغال من غير حركة بمحرك، بس بيفيد لو جزء اتحرك أثناء التجربة.`,
    `Not central to the challenge because the prototype has no powered movement, but useful if a part moves during an experiment.`],
 e:[`جسم بدأ من السكون وتسارعه 2 m/s² لمدة 3 s: v = 0 + 2 × 3 = 6 m/s. وبنحط البروتوتايب على سطح ثابت ومنسيبوش يقع، لأن الصدمة ممكن تبوّظ بنيته وتأثر على الاختبار.`,
    `Starting at rest and accelerating at 2 m/s² for 3 s: v = 0 + 2 × 3 = 6 m/s. Place the prototype on a stable surface and never let it fall, since an impact could damage the structure and affect the test.`],
 x:[`الربط محدود. الميكانيكا بتفيد في فهم الحركة والثبات التجريبي، والهدف الأساسي هو التحكم في انتقال الطاقة أو المادة بخواص الخامة والشكل.`,
    `The direct link is limited. Mechanics helps with motion and experimental stability, while the main goal is controlling the transfer of energy or matter through material properties and shape.`]},

{id:'chem1',s:'Chemistry',lo:1,t:'Scientific method & density',g:3,
 h:['ΔT والمتغيرات الثابتة','ΔT and constant variables'],
 c:[`Scientific method: مشكلة، بعدين hypothesis، بعدين تصميم تجربة. independent variable (زي خامة العزل) و dependent variable (زي تغيّر الحرارة). الباقي لازم يفضل ثابت: درجة البداية وحجم الحاوية ووقت الاختبار. بنستخدم SI units وأجهزة دقيقة وقياسات متكررة.`,
    `Scientific method: identify a problem, form a hypothesis, design an experiment. The independent variable is e.g. the insulation material, the dependent variable is e.g. the temperature change. Keep starting temperature, container size and test time constant. Use SI units, accurate instruments and repeated measurements.`],
 l:[`ده الإطار اللي بنصمم ونختبر ونحسّن بيه البروتوتايب.`,
    `This is the framework we use to design, test and improve the prototype.`],
 e:[`نقارن كرتون وقماش معاد و bubble wrap في حاويات منفصلة. من 60°C إلى 45°C بعد 20 دقيقة: ΔT = 60 − 45 = 15°C. لو حاوية تانية نزلت 8°C بس بنفس الظروف، يبقى عزلها أحسن. وρ = m ÷ V: 120 g ÷ 200 cm³ = 0.6 g/cm³.`,
    `Compare cardboard, reused fabric and bubble wrap in separate containers. From 60°C to 45°C after 20 minutes: ΔT = 60 − 45 = 15°C. A container that drops only 8°C under the same conditions insulates better. Density ρ = m ÷ V: 120 g ÷ 200 cm³ = 0.6 g/cm³.`],
 x:[`density واطية لوحدها مش دليل إن الخامة عازل كويس. القرار النهائي بنتايج الاختبار والأمان والتكلفة واستخدام الخامة.`,
    `Low density alone does not prove a good insulator. The final choice depends on test results, safety, cost and material use.`]},
{id:'chem2',s:'Chemistry',lo:2,t:'Atoms & radiation',g:0,
 h:['خامات مختلفة، طاقات مختلفة','Different materials, different energies'],
 c:[`Atoms فيها protons و neutrons و electrons. عدد الـ protons هو اللي بيحدد العنصر. Isotopes: نفس العنصر بعدد neutrons مختلف. Isobars: نفس mass number وatomic numbers مختلفة. Isotones: نفس عدد neutrons. الإشعاع النووي: alpha و beta و gamma، وبيختلفوا في قدرتهم على اختراق المواد.`,
    `Atoms contain protons, neutrons and electrons. The proton number identifies the element. Isotopes: same element, different neutrons. Isobars: same mass number, different atomic numbers. Isotones: same number of neutrons. Nuclear radiation (alpha, beta, gamma) differs in how far it passes through materials.`],
 l:[`الاتنين عن تفاعل المادة مع حاجة بتعدّي خلالها. والتحدي ممكن يحتاج خامة تقلل نفاذ الضوء أو الصوت أو الحرارة أو الميّة.`,
    `Both topics are about how matter interacts with something travelling through it. The challenge may need a material that reduces the transmission of light, sound, heat or water.`],
 e:[`الفكرة العامة: الخامات المختلفة بتتفاعل بشكل مختلف مع أشكال الطاقة المختلفة، فنختبر الخامة اللي اخترناها بطرق آمنة ومعتمدة من المدرسة.`,
    `The general idea: different materials interact differently with different forms of energy, so we test our chosen material using safe, school-approved methods.`],
 x:[`حجب الضوء أو الحرارة مش نفس الحماية من الإشعاع النووي. Gamma rays محتاجة تدريع متخصص وإجراءات أمان، ومينفعش نستخدم مصادر نووية في البروتوتايب.`,
    `Blocking light or heat is not the same as shielding nuclear radiation. Gamma rays need specialized shielding and safety procedures, and we must not use nuclear sources in the prototype.`]},
{id:'chem3',s:'Chemistry',lo:3,t:'Electrons & EM spectrum',g:0,
 h:['Light-shielding و c = fλ','Light-shielding and c = fλ'],
 c:[`الإلكترون لما يمتص طاقة بيطلع لمستوى طاقة أعلى، ولما يرجع لمستوى أقل بيطلّق طاقة. الـ electromagnetic spectrum: radio و microwaves و infrared و visible light و ultraviolet و X-rays و gamma. والعلاقة: c = fλ.`,
    `Electrons sit in energy levels: absorbing energy lifts an electron up, returning down releases energy. The electromagnetic spectrum: radio, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays. Wavelength and frequency relate by c = fλ.`],
 l:[`الموضوع ده مرتبط مباشرة بمسار light-shielding في التحدي.`,
    `This connects directly to the light-shielding pathway of the challenge.`],
 e:[`نختبر هل خامات معاد استخدامها بتقلل الضوء المرئي اللي بيعدّي: كرتون ممكن يحجب ضوء أكتر من بلاستيك شفاف رفيع. ونجرب شكل الدرع (overlapping panel أو louver). و light meter معتمد من المدرسة بيقارن الضوء قبل وبعد الحاجز. λ = 600 nm = 6×10⁻⁷ m يطلع f = 3×10⁸ ÷ 6×10⁻⁷ = 5×10¹⁴ Hz.`,
    `Test whether reused materials reduce the visible light passing through: cardboard may block more than thin clear plastic. Try shield shapes such as an overlapping panel or louver, and compare light levels before and after the barrier with a school-approved light meter. λ = 600 nm = 6×10⁻⁷ m gives f = 3×10⁸ ÷ 6×10⁻⁷ = 5×10¹⁴ Hz.`],
 x:[`الـ photoelectric effect و flame tests أمثلة على تفاعل الضوء مع المادة، بس مش لازمين لبناء البروتوتايب.`,
    `The photoelectric effect and flame tests show how light interacts with matter but are not needed to build the prototype.`]},
{id:'chem4',s:'Chemistry',lo:4,t:'Periodic table',g:1,
 h:['المعدن بيوصّل حرارة','Metals conduct heat'],
 c:[`الـ periodic table مرتب بالـ atomic number والـ electronic configuration. نفس الـ group يعني نفس عدد valence electrons وبالتالي خواص كيميائية متشابهة. Periodic trends: atomic radius و ionization energy و electronegativity و electron affinity. وبيفسّر ليه metals و nonmetals و metalloids مختلفين.`,
    `The periodic table is ordered by atomic number and electronic configuration. Elements in a group share valence electrons, so they have similar chemistry. Trends: atomic radius, ionization energy, electronegativity, electron affinity. They explain why metals, nonmetals and metalloids differ.`],
 l:[`اختيار الخامة محتاج فهم خواصها وتفاعلها مع اللي حواليها.`,
    `Choosing materials requires understanding their properties and how they interact with their surroundings.`],
 e:[`الفلزات غالبًا موصّلات حرارة كويسة، وكتير من اللافلزات زي الخشب وبعض البلاستيك بتتستخدم للعزل. فنتجنب كمية كبيرة من معدن مكشوف في حاوية عزل حراري، ونجرب كرتون أو قماش أو تغليف بلاستيك معاد استخدامه.`,
    `Metals generally conduct heat well, while many nonmetals such as wood and some plastics are used for insulation. So avoid a large amount of exposed metal in a thermal container and test reused cardboard, fabric or plastic packaging.`],
 x:[`الـ periodic table بيفسّر الأسباب الذرية ورا خواص الخامات، لكن القرار الهندسي بيتبني على الاختبار.`,
    `The periodic table explains the atomic reasons behind material properties, but the engineering decision is based on testing.`]},

{id:'phys1',s:'Physics',lo:1,t:'Measurement',g:3,
 h:['SI و accuracy و precision','SI units, accuracy and precision'],
 c:[`SI units: كتلة بالـ kg وطول بالـ m وزمن بالـ s وحرارة بالـ °C. Accuracy: قرب القياس من القيمة الحقيقية. Precision: قرب القياسات المتكررة من بعضها. أخطاء القياس بتأثر على الاستنتاج. و dimensional analysis بيراجع الحسابات.`,
    `SI units: mass in kg, length in m, time in s, temperature in °C. Accuracy is closeness to the true value. Precision is closeness of repeated measurements to each other. Measurement errors affect conclusions. Dimensional analysis checks calculations.`],
 l:[`ده اللي بيخلي اختبار البروتوتايب علمي.`,
    `This is what makes testing the prototype scientific.`],
 e:[`نقيس الحرارة جوّه حاوية معزولة كل 5 دقايق لمدة 20 دقيقة. من 50°C إلى 42°C: ΔT = 42 − 50 = −8°C، والسالب معناه إن الحرارة نزلت. نقارن بحاوية غير معزولة بنفس الظروف. والسرعة بالـ m/s لأن v = distance (m) ÷ time (s).`,
    `Measure the temperature inside an insulated container every 5 minutes for 20 minutes. From 50°C to 42°C: ΔT = 42 − 50 = −8°C, and the negative sign means it dropped. Compare with an uninsulated container under the same conditions. Speed is in m/s because v = distance (m) ÷ time (s).`],
 x:[`استخدم أدوات مناسبة وكرّر كل اختبار بنفس الظروف.`,
    `Use suitable instruments and repeat each test under the same conditions.`]},
{id:'phys2',s:'Physics',lo:2,t:'Equilibrium & Newton\'s 3rd law',g:2,
 h:['N = mg والثبات','N = mg and stability'],
 c:[`Static equilibrium: الجسم ساكن و net force = 0. Dynamic equilibrium: سرعة ثابتة و net force = 0. Newton's 3rd law: لو جسم أثّر بقوة على تاني، التاني بيأثر بقوة مساوية ومعاكسة.`,
    `Static equilibrium: at rest, net force zero. Dynamic equilibrium: constant velocity, net force zero. Newton's third law: if one object pushes on another, the second pushes back equally and oppositely.`],
 l:[`البروتوتايب لازم يحافظ على شكله ويفضل ثابت أثناء الاختبار.`,
    `The prototype must keep its shape and stay stable during testing.`],
 e:[`حاوية بقاعدة عريضة أثبت من حاوية بقاعدة ضيقة. واللوح متعدد الطبقات لازم يشيل وزنه من غير ما ينحني أو يتفكك. بنستخدم free-body diagram عشان نحدد القوى (الجاذبية و support force من الترابيزة). على ترابيزة أفقية والجسم ساكن: F_net = N − mg = 0 يعني N = mg. كتلة 0.5 kg و g = 9.8 m/s² يطلع N = 4.9 N.`,
    `A container with a wide base is more stable than a narrow one, and a layered panel must support its own weight without bending. A free-body diagram shows gravity and the support force from the table. At rest on a level table: F_net = N − mg = 0, so N = mg. With 0.5 kg and g = 9.8 m/s²: N = 4.9 N.`],
 x:[`ده بيفيد في الثبات الإنشائي، لكن التحدي كمان بيطلب إننا نختبر وظيفة العزل نفسها.`,
    `This helps with structural stability, but the challenge also requires testing the insulation function itself.`]},
{id:'phys3',s:'Physics',lo:3,t:'Newton\'s laws',g:2,
 h:['Balanced forces','Balanced forces'],
 c:[`لو net force = 0 حركة الجسم متتغيرش. ولو مش صفر الجسم بيتسارع حسب F = ma. القوة vector لأن ليها مقدار واتجاه.`,
    `If the net force is zero, motion does not change. If it is not zero, the object accelerates by F = ma. Force is a vector: it has magnitude and direction.`],
 l:[`الهيكل لازم يفضل ثابت وميتحركش أو يتشوه بسهولة أثناء العرض.`,
    `The structure should remain stable and should not move or deform easily during the exhibition.`],
 e:[`الحاجز متعدد الطبقات لازم يفضل في مكانه وإحنا بنقيس كمية heat أو sound أو light أو water اللي بتعدّي منه. وبنستخدم فكرة الـ system عشان ندرس تفاعل الحاوية ومحتوياتها والبيئة المحيطة.`,
    `A layered barrier must stay in place while we measure the heat, sound, light or water passing through it. The idea of a system helps us study how the container, its contents and the surroundings interact.`],
 x:[`التحدي أساسًا عن عزل passive مش عن الحركة. Centripetal force مش مطلوبة إلا لو درسنا نظام دوّار منفصل. الأهم هنا: balanced forces وثبات الخامة وانتقال الطاقة عبر الحاجز.`,
    `The challenge is about passive insulation, not motion. Centripetal force is not needed unless we study a separate rotating system. What matters most: balanced forces, material stability and energy transfer through the barrier.`]},
{id:'phys4',s:'Physics',lo:4,t:'Gravity, mass & weight',g:2,
 h:['5 kg تساوي تقريبًا 49 N','5 kg is about 49 N'],
 c:[`Gravity قوة جذب بين الأجسام اللي ليها كتلة، وبتعتمد على الكتلتين والمسافة بين مركزيهما (Universal Law of Gravitation). Mass: كمية المادة وبتفضل ثابتة. Weight: قوة الجاذبية على الجسم وبتتغير حسب المجال. وفي Free fall وفي apparent weight.`,
    `Gravity is an attraction between objects with mass; it depends on both masses and the distance between their centers (Universal Law of Gravitation). Mass is the amount of matter and stays constant. Weight is the gravitational force and changes with the field. Free fall and apparent weight also appear.`],
 l:[`البروتوتايب مينفعش تزيد كتلته عن 5 kg.`,
    `The prototype must not exceed 5 kg in mass.`],
 e:[`كتلة 5 kg على الأرض يبقى وزنها تقريبًا 49 N. بناخد الكتلة والوزن في الاعتبار عشان الهيكل يبقى سهل الحمل وثابت أثناء الاختبار.`,
    `A 5 kg prototype on Earth weighs about 49 N. Consider both mass and weight so the structure is easy to carry and stable during testing.`],
 x:[`الجاذبية كمان بتأثر على إزاي الخامات بتتدعم في الهيكل، فلازم نختار شكل وخامات قوية كفاية.`,
    `Gravity also affects how materials are supported by the structure, so choose a suitable shape and strong enough materials.`]},

{id:'cs1',s:'CS',lo:1,t:'ICT',g:4,
 h:['بحث وجداول رقمية','Research and digital tables'],
 c:[`ICT بيساعد الناس تجمع وتنظّم وتنشئ وتشارك المعلومات بأدوات رقمية وإنترنت.`,
    `ICT helps people collect, organize, create and share information with digital tools and the internet.`],
 l:[`في الـ Capstone Challenge بنستخدم ICT عشان نبحث عن خامات العزل ونقارن خواصها ونجمع أدلة علمية قبل ما نختار التصميم.`,
    `In the Capstone Challenge we use ICT to research insulating materials, compare their properties and collect scientific evidence before choosing a design.`],
 e:[`جدول رقمي بيقارن كرتون وقماش وبلاستيك بالكتلة والتكلفة وتقليل heat transfer. ومستندات أونلاين لتسجيل التجارب والحسابات وتحسينات التصميم، ومشاركة النتايج مع الفريق والمدرسين. وبحث عن طرق إعادة استخدام الخامات وتقليل الـ waste.`,
    `A digital table comparing cardboard, fabric and plastic by mass, cost and heat-transfer reduction. Online documents to record experiments, calculations and improvements, and sharing results with the team and teachers. Research on reusing materials and reducing waste.`]},
{id:'cs2',s:'CS',lo:2,t:'OS & file management',g:4,
 h:['فولدرات و backup','Folders and backups'],
 c:[`الـ operating system بيدير الـ hardware والـ software ويسمح لك تشغّل برامج وتنظّم ملفات. File management: إنشاء فولدرات ونسخ ونقل وحذف وبحث و compression.`,
    `An operating system manages hardware and software and lets you run applications and organize files. File management: create folders, copy, move, delete, search and compress.`],
 l:[`محتاجين ننظّم كل المعلومات المتعلقة بالمشروع.`,
    `We need to organize all the information related to the project.`],
 e:[`فولدرات منفصلة للـ research وخواص الخامات والبيانات التجريبية والحسابات وصور البروتوتايب والعرض النهائي. القياسات في spreadsheet والتقارير في ملفات document. Compression بيسهّل مشاركة الملفات الكبيرة، و backups منتظمة بتحمي الشغل، وأسماء ملفات واضحة وتنظيم لنسخ التصميم.`,
    `Separate folders for research, material properties, experimental data, calculations, prototype photos and the final presentation. Temperature measurements in a spreadsheet and reports in documents. Compression for sharing large files, regular backups, clear file names and organized design versions.`],
 x:[`التنظيم الكويس بيوفر وقت وبيدعم الشغل الجماعي وبيوثّق كل مرحلة من Engineering Design Process في الـ Capstone Portfolio.`,
    `Good file management saves time, supports teamwork and documents every stage of the Engineering Design Process in the Capstone Portfolio.`],xl:'sum'},
{id:'cs3',s:'CS',lo:3,t:'Word processing',g:4,
 h:['تقرير الـ Portfolio','The portfolio report'],
 c:[`برامج الـ word-processing بتسمح تنشئ وتعدّل وتنسّق وتحفظ وتطبع مستندات احترافية، وبتنظّم المعلومات بـ headings و paragraphs و tables و images و page layouts.`,
    `Word processors let you create, edit, format, save and print professional documents, organized with headings, paragraphs, tables, images and page layouts.`],
 l:[`بنستخدمها عشان نجهّز الـ Capstone Portfolio ونوثّق الـ Engineering Design Process.`,

/* ---- progress with count-up ---- */
var shownK=0,cntRaf=0;
function progText(n){
  var N=LOS.length;
  if(lang==='ar')return 'عارف '+n+' من '+N;
  if(lang==='en')return n+' of '+N+' known';
  return n+' / '+N+' · عارف / known';
}
function progress(instant){
  var k=known();
  $('#progBar').style.width=Math.round(k/LOS.length*100)+'%';
  cancelAnimationFrame(cntRaf);
  if(RM||instant||k===shownK){shownK=k;$('#progTxt').textContent=progText(k);return}
  var from=shownK,t0=null;
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/600);
    var v=Math.round(from+(k-from)*(1-Math.pow(1-p,3)));
    $('#progTxt').textContent=progText(v);
    if(p<1)cntRaf=requestAnimationFrame(step);else shownK=k;
  }
  cntRaf=requestAnimationFrame(step);
}

  pts.forEach(function(p,i){
    var g=GROUPS[i],items=LOS.filter(function(o){return o.g===i}).length;
    var above=(i===0);
    var y1,y2;
    if(lang==='both'){y1=above?p.y-50:p.y+46;y2=above?p.y-36:p.y+62}else{y1=above?p.y-38:p.y+46;y2=0}

       '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+R+'"/><text class="n" x="'+p.x+'" y="'+(p.y+6)+'">'+items+'</text>';

    }else{
      s+='<text class="lb" x="'+p.x+'" y="'+y1+'">'+esc(S(g.v))+'</text>';

  });

var mode='flash',filt=-1,cur=null,shown=false;
function pool(){return LOS.filter(function(o){return filt<0||o.g===filt})}
function pick(){
  var p=pool();
  var lo=Math.min.apply(null,p.map(bx));
  var cap=Math.random()<0.25?lo+1:lo;
  var c=p.filter(function(o){return bx(o)<=cap&&(p.length===1||!cur||o.id!==cur.id)});
  if(!c.length)c=p;
  return c[Math.floor(Math.random()*c.length)];
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function ansHTML(o){
  return '<dl class="ans"><div class="link"><dt>'+I(U.link)+'</dt><dd>'+L(o.l)+'</dd></div><div><dt>'+I(U.example)+'</dt><dd>'+L(o.e)+'</dd></div>'+(o.x?'<div><dt>'+I(xLabel(o))+'</dt><dd>'+L(o.x)+'</dd></div>':'')+'</dl>';
}
function stage(anim){
  var st=$('#stage');
  if(!cur||(filt>=0&&cur.g!==filt))cur=pick();
  var cls='fc'+(anim?' '+anim:'');
  if(mode==='flash'){
    st.innerHTML='<div class="'+cls+'"><span class="tag" style="--g:var('+GROUPS[cur.g].css+')">'+esc(tagOf(cur))+'</span><h3>'+esc(cur.t)+'</h3>'+
      (shown?ansHTML(cur)+'<div class="row-b"><button type="button" class="btn" data-r="1">'+I(U.gotIt)+'</button><button type="button" class="btn alt" data-r="0">'+I(U.forgot)+'</button></div>'
            :'<p class="cue">'+L(U.cueFlash)+'</p><div class="row-b"><button type="button" class="btn" id="reveal">'+I(U.reveal)+'</button></div>')+'</div>';
  }else{
    var same=shuffle(LOS.filter(function(o){return o.id!==cur.id&&o.g===cur.g})).slice(0,2);
    var rest=shuffle(LOS.filter(function(o){return o.id!==cur.id&&o.g!==cur.g})).slice(0,3-same.length);
    var opts=shuffle([cur].concat(same,rest));
    st.innerHTML='<div class="'+cls+'"><p class="cue">'+L(U.cueGuess)+'</p><p class="ex">'+L(cur.e)+'</p><div class="opts">'+
      opts.map(function(o){return '<button type="button" class="opt" data-id="'+o.id+'"><span class="tag">'+esc(tagOf(o))+'</span><span>'+esc(o.t)+'</span></button>'}).join('')+
      '</div><div id="gfb"></div></div>';
  }
}
function next(){cur=pick();shown=false;stage('slide')}
$('#stage').addEventListener('click',function(ev){
  var t=ev.target;if(!t.closest)return;
  if(t.closest('#reveal')){shown=true;stage('flip');return}
  var r=t.closest('[data-r]');
  if(r){setBox(cur,r.getAttribute('data-r')==='1'?bx(cur)+1:0);refreshMap();next();return}
  var op=t.closest('.opt');
  if(op&&!op.disabled){
    var ok=op.getAttribute('data-id')===cur.id;
    $$('.opt').forEach(function(b){b.disabled=true;if(b.getAttribute('data-id')===cur.id)b.classList.add('right')});
    if(!ok)op.classList.add('wrong');
    setBox(cur,ok?bx(cur)+1:bx(cur)-1);refreshMap();
    $('#gfb').innerHTML='<p class="fb '+(ok?'ok':'no')+'">'+(ok?I(U.right):I(U.wrong)+' '+esc(tagOf(cur)))+'</p><div class="fbx"><p style="margin-top:.4rem">'+L(cur.l)+'</p><div class="row-b" style="margin-top:.8rem"><button type="button" class="btn" id="nextG">'+I(U.next)+'</button></div></div>';
    return;
  }
  if(t.closest('#nextG'))next();
});

  gen:function(){var l=R([400,450,500,600,700]),a=r2(3000/l);return{q:['ضوء طوله الموجي '+l+' nm. التردد f بوحدة 10¹⁴ Hz؟ (قرّب لرقمين بعد العلامة)','Light has a wavelength of '+l+' nm. What is the frequency f in units of 10¹⁴ Hz? (round to 2 decimals)'],ans:a,steps:'f = 3×10⁸ ÷ ('+l+'×10⁻⁹) = '+a+'×10¹⁴ Hz'}}},
 {tag:'Physics LO2 · LO4',title:['القوة من الكتلة','Force from mass'],f:'N = mg ,  g = 9.8 m/s²',unit:'N',tol:0.011,
  gen:function(){var m=R([0.5,1,2,3,5]),a=r2(m*9.8);return{q:['جسم كتلته '+m+' kg على سطح أفقي ساكن. قوة الدعم N (أو الوزن)؟','An object of mass '+m+' kg rests on a level surface. What is the support force N (its weight)?'],ans:a,steps:m+' × 9.8 = '+a+' N'}}}
];
var probs=[];
function parseNum(s){
  s=String(s).trim().replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[٫,]/g,'.').replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(!/^-?\d*\.?\d+$/.test(s))return NaN;
  return parseFloat(s);
}
function numCard(i,cls){
  var g=GEN[i],p=probs[i];
  return '<article class="num'+(cls?' '+cls:'')+'" id="nc'+i+'" style="--i:'+i+'"><span class="tag">'+esc(g.tag)+'</span><h3>'+I(g.title)+'</h3><code>'+esc(g.f)+'</code>'+
   '<p class="q">'+L(p.q)+'</p><div class="inrow"><input id="in'+i+'" type="text" inputmode="decimal" autocomplete="off" aria-label="'+esc(S(U.yours))+'"><span class="unit">'+esc(g.unit)+'</span><button type="button" class="btn sm" data-n="check" data-i="'+i+'">'+I(U.check)+'</button></div>'+
   '<p class="res" id="rs'+i+'" aria-live="polite"></p><div class="row-b"><button type="button" class="btn alt sm" data-n="new" data-i="'+i+'">'+I(U.newn)+'</button><button type="button" class="btn alt sm" data-n="sol" data-i="'+i+'">'+I(U.sol)+'</button></div><div id="so'+i+'"></div></article>';
}
function renderNums(regen){
  var vals=[];
  if(!regen)vals=GEN.map(function(g,i){var e=$('#in'+i);return e?e.value:''});
  if(regen||!probs.length)probs=GEN.map(function(g){return g.gen()});
  $('#nums').innerHTML=GEN.map(function(g,i){return numCard(i)}).join('');
  if(!regen)vals.forEach(function(v,i){var e=$('#in'+i);if(e&&v)e.value=v});
}
function retrigger(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);el.addEventListener('animationend',function f(){el.classList.remove(cls);el.removeEventListener('animationend',f)})}
$('#nums').addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('[data-n]'):null;if(!b)return;
  var i=parseInt(b.getAttribute('data-i'),10),act=b.getAttribute('data-n'),g=GEN[i],card=$('#nc'+i);
  if(act==='check'){
    var v=parseNum($('#in'+i).value),rs=$('#rs'+i);
    if(isNaN(v)){rs.className='res no';rs.innerHTML='<span>'+I(U.enter)+'</span>';retrigger(card,'shake');return}
    if(Math.abs(v-probs[i].ans)<=g.tol){
      rs.className='res ok';
      rs.innerHTML='<span><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'+I(U.right)+'</span>';
      retrigger(card,'good');
    }else{
      rs.className='res no';rs.innerHTML='<span>'+I(U.miss)+'</span>';retrigger(card,'shake');
    }
  }else if(act==='sol'){
    var p=probs[i];
    $('#so'+i).innerHTML='<div class="sol">'+esc(p.steps)+(p.note?'<div class="nt">'+L(p.note)+'</div>':'')+'</div>';
  }else if(act==='new'){
    probs[i]=g.gen();
    var w=document.createElement('div');w.innerHTML=numCard(i,'swapin');
    card.replaceWith(w.firstChild);
    var inp=$('#in'+i);if(inp)inp.focus();
  }
});
$('#nums').addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.tagName==='INPUT'){
    var i=ev.target.id.replace('in','');var b=$('[data-n="check"][data-i="'+i+'"]');if(b)b.click();
  }
});

/* ---- motion helpers ---- */
var io=null;
function observe(){
  if(io){io.disconnect();io=null}
  if(RM||!('IntersectionObserver' in window))return;
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});
  },{rootMargin:'0px 0px -6% 0px',threshold:0.05});
  $$('#p-map .tpl, #p-map .grp header, #p-map .lo').forEach(function(el){
    if(el.getClientRects().length===0)return;
    var r=el.getBoundingClientRect();
    if(r.top<window.innerHeight*0.95)return;
    el.classList.add('rv');io.observe(el);
  });
}
function animatePanel(p){
  Array.prototype.slice.call(p.children).forEach(function(k,i){k.style.setProperty('--i',i)});
  $$('.nums>*,.chips>*',p).forEach(function(k,i){k.style.setProperty('--i',i)});
  p.classList.remove('panel-in');void p.offsetWidth;p.classList.add('panel-in');
}
function positionInd(){
  var nav=$('#tabs'),ind=$('#ind'),a=$('.tabs a[aria-current="page"]');
  if(!a)return;
  var nr=nav.getBoundingClientRect(),ar=a.getBoundingClientRect();
  var off=app.dir==='rtl'?(nr.right-ar.right):(ar.left-nr.left);
  ind.style.width=ar.width+'px';
  ind.style.transform='translateX('+(app.dir==='rtl'?-off:off)+'px)';
}
var spTick=false;
function onScroll(){
  if(spTick)return;spTick=true;
  requestAnimationFrame(function(){
    var h=document.documentElement.scrollHeight-window.innerHeight;
    var p=h>0?Math.min(1,Math.max(0,window.scrollY/h)):0;
    $('#sp').style.setProperty('--sp',p.toFixed(4));
    spTick=false;
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',positionInd);

/* ---- routing ---- */
var NAMES=['map','drill','numbers'];
var firstRoute=true;
function route(){
  var h=(location.hash||'#map').slice(1);
  if(NAMES.indexOf(h)<0)h='map';
  $$('[data-p]').forEach(function(s){s.hidden=s.getAttribute('data-p')!==h});
  $$('.tabs a').forEach(function(a){if(a.getAttribute('data-t')===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  positionInd();
  window.scrollTo(0,0);
  animatePanel($('#p-'+h));
  onScroll();
  if(h==='map')observe();
  firstRoute=false;
}
window.addEventListener('hashchange',route);

/* ---- language switch ---- */
function renderAll(){
  app.dir=lang==='en'?'ltr':'rtl';
  app.lang=lang==='en'?'en':'ar';
  var open={};$$('.lo[open]').forEach(function(d){open[d.id.slice(3)]=1});
  applyStatic();renderMap(open);renderChips();stage();renderNums(false);progress(true);positionInd();observe();
}
$('#langSeg').addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('button'):null;if(!b)return;
  var l=b.getAttribute('data-l');if(l===lang)return;
  lang=l;try{localStorage.setItem('kfs-j2-lang',lang)}catch(e){}
  main.classList.add('swap');
  setTimeout(function(){renderAll();main.classList.remove('swap')},RM?0:170);
});

/* ---- boot ---- */
app.dir=lang==='en'?'ltr':'rtl';app.lang=lang==='en'?'en':'ar';
applyStatic();renderMap();renderChips();renderNums(true);progress(true);stage();route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(positionInd);
})();
</script>
